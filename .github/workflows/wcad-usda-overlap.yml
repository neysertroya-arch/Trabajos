name: WCAD USDA overlap audit

on:
  push:
    branches: [audit/wcad-usda-overlap]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  overlap-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse audit scripts
        shell: Rscript {0}
        run: |
          parse("R/01_download_wcad.R")
          parse("R/02_audit_wcad.R")
          parse("R/02b_audit_wcad_comparability.R")
          parse("R/03_download_usda.R")
          parse("R/04_harmonize.R")
          cat("OVERLAP_AUDIT_R_PARSE_OK\n")

      - name: Download official FAOSTAT WCAD data
        run: Rscript R/01_download_wcad.R

      - name: Rebuild WCAD rental audit
        run: Rscript R/02_audit_wcad.R

      - name: Rebuild WCAD comparability audit
        run: Rscript R/02b_audit_wcad_comparability.R

      - name: Download official USDA ERS TFP data
        run: Rscript R/03_download_usda.R

      - name: Run WCAD USDA overlap audit
        run: Rscript R/04_harmonize.R

      - name: Upload overlap audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: wcad-usda-overlap-audit
          path: outputs/audit/wcad_usda_overlap/
          if-no-files-found: error
          retention-days: 14
