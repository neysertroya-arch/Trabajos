name: Descriptive and functional-form diagnostics

on:
  pull_request:
    paths:
      - 'R/**'
      - '.github/workflows/descriptive-diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Parse scripts
        run: |
          Rscript -e 'parse("R/01_download_wcad.R"); parse("R/02_audit_wcad.R"); parse("R/02b_audit_wcad_comparability.R"); parse("R/03_download_usda.R"); parse("R/04_harmonize.R"); parse("R/04b_audit_farm_structure.R"); parse("R/04c_add_development_controls.R"); parse("R/05_descriptive_diagnostics.R"); cat("DIAGNOSTICS_R_PARSE_OK\n")'

      - name: Rebuild WCAD
        run: |
          Rscript R/01_download_wcad.R
          Rscript R/02_audit_wcad.R
          Rscript R/02b_audit_wcad_comparability.R

      - name: Rebuild candidate sample
        run: |
          Rscript R/03_download_usda.R
          Rscript R/04_harmonize.R
          Rscript R/04b_audit_farm_structure.R
          Rscript R/04c_add_development_controls.R

      - name: Run descriptive and functional-form diagnostics
        run: Rscript R/05_descriptive_diagnostics.R

      - name: Upload diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: descriptive-functional-form-diagnostics
          path: outputs/diagnostics/
          if-no-files-found: error
          retention-days: 14
