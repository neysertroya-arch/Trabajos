name: Reproducibility check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Verify project scaffold
        shell: bash
        run: |
          test -f _quarto.yml
          test -f manuscript/article.qmd
          test -f manuscript/references.bib
          test -f R/00_setup.R
          test -f R/01_download_wcad.R
          test -f R/02_audit_wcad.R
          test -f R/02b_audit_wcad_comparability.R
          test -f R/03_download_usda.R
          test -f R/04_harmonize.R
          test -f R/04b_audit_farm_structure.R
          test -f R/04c_add_development_controls.R
          test -f R/05_descriptive_diagnostics.R
          test -f R/06_models_robustness.R
          test -f R/07_advanced_robustness.R
          test -f R/08_publication_outputs.R

      - name: Parse analytical pipeline
        shell: Rscript {0}
        run: |
          for (f in c(
            "R/01_download_wcad.R",
            "R/02_audit_wcad.R",
            "R/02b_audit_wcad_comparability.R",
            "R/03_download_usda.R",
            "R/04_harmonize.R",
            "R/04b_audit_farm_structure.R",
            "R/04c_add_development_controls.R",
            "R/05_descriptive_diagnostics.R",
            "R/06_models_robustness.R",
            "R/07_advanced_robustness.R",
            "R/08_publication_outputs.R"
          )) parse(f)
          cat("ANALYTICAL_PIPELINE_PARSE_OK\n")

      - name: Rebuild analytical pipeline
        run: |
          Rscript R/01_download_wcad.R
          Rscript R/02_audit_wcad.R
          Rscript R/02b_audit_wcad_comparability.R
          Rscript R/03_download_usda.R
          Rscript R/04_harmonize.R
          Rscript R/04b_audit_farm_structure.R
          Rscript R/04c_add_development_controls.R
          Rscript R/05_descriptive_diagnostics.R
          Rscript R/06_models_robustness.R
          Rscript R/07_advanced_robustness.R
          Rscript R/08_publication_outputs.R

      - name: Upload WCAD audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: wcad-feasibility-audit
          path: outputs/audit/wcad/
          if-no-files-found: error
          retention-days: 14

      - name: Render Quarto manuscript
        run: quarto render --to html
