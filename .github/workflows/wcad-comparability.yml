name: WCAD comparability audit

on:
  push:
    branches: [audit/wcad-comparability]
  pull_request:
    branches: [main]
    paths:
      - "R/01_download_wcad.R"
      - "R/02_audit_wcad.R"
      - "R/02b_audit_wcad_comparability.R"
      - ".github/workflows/wcad-comparability.yml"
  workflow_dispatch:

jobs:
  wcad-comparability:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse WCAD audit scripts
        shell: Rscript {0}
        run: |
          parse("R/01_download_wcad.R")
          parse("R/02_audit_wcad.R")
          parse("R/02b_audit_wcad_comparability.R")
          cat("WCAD_COMPARABILITY_R_PARSE_OK\n")

      - name: Download official FAOSTAT WCAD data
        run: Rscript R/01_download_wcad.R

      - name: Rebuild WCAD rental audit
        run: Rscript R/02_audit_wcad.R

      - name: Run WCAD temporal comparability audit
        run: Rscript R/02b_audit_wcad_comparability.R

      - name: Upload WCAD comparability outputs
        uses: actions/upload-artifact@v4
        with:
          name: wcad-comparability-audit
          path: outputs/audit/wcad_comparability/
          if-no-files-found: error
          retention-days: 14
