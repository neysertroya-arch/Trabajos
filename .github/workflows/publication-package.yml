name: Publication package

on:
  pull_request:
    paths:
      - 'R/**'
      - 'manuscript/**'
      - '_quarto.yml'
      - '.github/workflows/publication-package.yml'
  workflow_dispatch:

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Parse publication pipeline
        run: |
          Rscript -e 'for(f in c("R/01_download_wcad.R","R/02_audit_wcad.R","R/02b_audit_wcad_comparability.R","R/03_download_usda.R","R/04_harmonize.R","R/04b_audit_farm_structure.R","R/04c_add_development_controls.R","R/05_descriptive_diagnostics.R","R/06_models_robustness.R","R/07_advanced_robustness.R","R/08_publication_outputs.R")) parse(f); cat("PUBLICATION_PIPELINE_PARSE_OK\n")'

      - name: Rebuild approved analytical pipeline
        run: |
          Rscript R/01_download_wcad.R
          Rscript R/02_audit_wcad.R
          Rscript R/02b_audit_wcad_comparability.R
          Rscript R/03_download_usda.R
          Rscript R/04_harmonize.R
          Rscript R/04b_audit_farm_structure.R
          Rscript R/04c_add_development_controls.R
          Rscript R/05_descriptive_diagnostics.R
          Rscript R/06_models_robustness.R
          Rscript R/07_advanced_robustness.R

      - name: Build publication outputs
        run: Rscript R/08_publication_outputs.R

      - name: Render manuscript
        run: quarto render --to html

      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: publication-package
          path: |
            outputs/publication/
            _quarto/
          if-no-files-found: error
          retention-days: 14
