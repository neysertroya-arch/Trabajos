name: Final analytical sample audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  final-sample-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Parse scripts
        run: |
          Rscript -e 'parse("R/01_download_wcad.R"); parse("R/02_audit_wcad.R"); parse("R/02b_audit_wcad_comparability.R"); parse("R/03_download_usda.R"); parse("R/04_harmonize.R"); parse("R/04b_audit_farm_structure.R"); parse("R/04c_add_development_controls.R"); cat("FINAL_SAMPLE_R_PARSE_OK\n")'
      - name: Rebuild WCAD
        run: |
          Rscript R/01_download_wcad.R
          Rscript R/02_audit_wcad.R
          Rscript R/02b_audit_wcad_comparability.R
      - name: Rebuild WCAD-USDA candidate sample
        run: |
          Rscript R/03_download_usda.R
          Rscript R/04_harmonize.R
      - name: Rebuild farm structure
        run: Rscript R/04b_audit_farm_structure.R
      - name: Add development controls and audit final sample
        run: Rscript R/04c_add_development_controls.R
      - name: Upload final sample audit
        uses: actions/upload-artifact@v4
        with:
          name: final-analytical-sample-audit
          path: outputs/audit/final_sample/
          if-no-files-found: error
          retention-days: 14
